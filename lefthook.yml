# Git hooks for every writer: humans and agents.
# Install: mise run hooks-install
pre-commit:
  # Run the jobs in order, and stop at the first failure.
  piped: true
  jobs:
    - name: lease
      # A session commits only to a repository that is free, whose lease it holds, or on which it
      # has a sub-lease. On a deny, lease-gate names the holder and the way. A commit with no agent
      # session passes, and without lease-gate on the PATH the job passes too.
      run: command -v lease-gate >/dev/null 2>&1 || exit 0; lease-gate
    - name: install
      # Install the dependencies from bun.lock, as mise run test does, so that the lint finds its libraries
      # in a new checkout.
      run: mise exec -- bun install --frozen-lockfile --silent
    - name: public-check
      # The repository is public (AGENTS.md): no local path and no private project name in a staged file.
      # A contributor without public-check on the PATH gets a note, and the hook passes.
      run: if command -v public-check >/dev/null 2>&1; then public-check {staged_files}; else echo "public-check not found, skipped"; fi
    - name: tbl-md lint
      # Fails on a GFM pipe table and on an invalid tbl block in a staged Markdown file (AGENTS.md).
      # --max-warnings 0 also fails on an attribute key that .tbl-md.json does not list, because a warning is no check.
      glob: "*.md"
      run: mise exec -- bun src/cli.ts lint --max-warnings 0 {staged_files}
    - name: plan hook
      # The checks of the maintainers that name private tools live in the private plan folder, not here (AGENTS.md).
      # A checkout without .plan/hooks/pre-commit skips this job.
      run: if [ -x .plan/hooks/pre-commit ]; then .plan/hooks/pre-commit; else echo "no plan hook, skipped"; fi
pre-push:
  jobs:
    - name: test
      # The tests run locally before each push, not as CI runs on GitHub.
      # With git-autopush on the PATH, the job waits for a free test slot and skips a tree that passed before.
      run: if command -v git-autopush >/dev/null 2>&1; then git-autopush tests -- mise run test; else mise run test; fi
    - name: doctor format
      # The JSON of `mise run doctor --json` must have the shared doctor format. A contributor without doctor-lint on
      # the PATH gets a note, and the hook passes.
      run: if command -v doctor-lint >/dev/null 2>&1; then doctor-lint --run; else echo "doctor-lint not found, skipped"; fi

post-commit:
  jobs:
    - name: push at once
      # Rule push-after-each-commit: the remote is the backup. git-autopush of meta pushes the current branch in a
      # detached process and returns at once; a failure goes into .git/push-failed. Without git-autopush on the
      # PATH, the job does nothing.
      run: if command -v git-autopush >/dev/null 2>&1; then git-autopush post-commit; fi

post-merge:
  jobs:
    - name: push a merge at once
      # A merge, a fast-forward, or a pull fires no post-commit hook. So the merge of a step into the trunk
      # pushes itself. The pull inside git-autopush sets GIT_AUTOPUSH=0, so it starts no second push.
      run: if command -v git-autopush >/dev/null 2>&1; then git-autopush post-merge; fi
